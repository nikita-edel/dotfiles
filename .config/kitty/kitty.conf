shell pwsh -NoLogo

enable_audio_bell no
font_size 18.0
remember_window_size no

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

# Right-click: copy selection if any, else paste (see copy_or_paste.py)
mouse_map right press ungrabbed kitten copy_or_paste.py

# the only shift+enter encoding pwsh's console can decode. Apps using the kitty
# keyboard protocol (nvim) are not in these modes, so they still get the real key
map shift+enter send_text normal,application \x1b[1;2M
